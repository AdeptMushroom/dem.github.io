<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaporwave Blog</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom, #2b1055, #7597de);
      font-family: 'Verdana', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ретро-солнце */
    .sun {
      position: absolute;
      width: 200px;
      height: 200px;
      background: linear-gradient(to bottom, #ffdd00, #ff0055);
      border-radius: 50%;
      top: 15%;
      box-shadow: 0 0 40px #ff0055;
      z-index: 1;
    }

    /* Ретро-сетка на полу */
    .grid {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 50%;
      background-image: 
        linear-gradient(rgba(255, 0, 128, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 128, 0.4) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: perspective(300px) rotateX(60deg) translateY(100px) translateX(-25%);
      z-index: 2;
      animation: gridMove 2s linear infinite;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 40px; }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 2rem 3rem;
      border: 2px solid #00f0ff;
      border-radius: 4px;
      box-shadow: 4px 4px 0px #ff0055;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      margin: 0;
      background: linear-gradient(to right, #00f0ff, #ff0055);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-style: italic;
    }

    p {
      color: #fff;
      font-size: 1.1rem;
      margin: 1.5rem 0;
      text-shadow: 2px 2px 0px #000;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #ff0055;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      border: 2px solid #fff;
      box-shadow: 3px 3px 0px #00f0ff;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #00f0ff;
    }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="grid"></div>
  
  <div class="content">
    <h1>Retro Blog</h1>
    <p>Погрузись в эстетику 80-х. Музыка, код и неоновые сны.</p>
    <a href="#" class="btn">START</a>
  </div>
</body>
</html>
